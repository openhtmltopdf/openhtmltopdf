<!DOCTYPE html>
<html lang="EN-US">
<head>
  <title>Fictional Garden Club: structure example</title>
  <meta name="subject" content="PDF/UA list items that are not li inside a list"/>
  <meta name="author" content="Fictional Garden Club"/>
  <meta name="description" content="A div and a table displayed as list items inside a ul keep their content in the structure tree"/>

  @page { margin: 30px 20px 60px 20px; }

  </style>
