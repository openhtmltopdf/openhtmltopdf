<!DOCTYPE html>
<html lang="EN-US">
<head>
  <title>Fictional Garden Club: structure example</title>
  <meta name="subject" content="PDF/UA div displayed as a list item"/>
  <meta name="author" content="Fictional Garden Club"/>
  <meta name="description" content="A marker on a box that is not a list item is a layout artifact"/>
  <style>
  @page { margin: 30px 20px 60px 20px; }
  body { margin: 0; font-family: 'TestFont'; font-size: 15px; }
  .item { display: list-item; margin-left: 20px; }
  </style>
</head>
<body>
  <div class="item">First point.</div>
  <div class="item">Second point.</div>
</body>
</html>
