<!DOCTYPE html>
<html lang="EN-US">
<head>
  <title>Fictional Garden Club: structure example</title>
  <meta name="subject" content="PDF/UA decorative image in a running footer"/>

  <meta name="description" content="A linked alt-empty image in running content stays an artifact"/>
  <style>
  @page {
    margin: 30px 20px 60px 20px;
    @bottom-center { font-family: 'TestFont'; font-size: 12px; content: element(footer); }
  }
  body { margin: 0; font-family: 'TestFont'; font-size: 15px; }
  #footer { position: running(footer); }
  </style>
</head>
<body>
  <div id="footer">
    <p><a href="https://example.com/app" title="App"><img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAgAAAAICAIAAABLbSncAAAAHElEQVR4nGP4sM8RjpTjp8ERAxUlkDnIiqgoAQDh82DhFUXpLQAAAABJRU5ErkJggg==" width="16" height="16" alt=""/></a>
      <a href="https://example.com" title="Homepage">example.com</a></p>
  </div>
  <p>Body text.</p>
</body>
</html>
