<html>
<head>
    <title>Test: Text Alignment</title>
    <style type="text/css">
            .test1 { text-decoration: none; }
            .test2 { text-decoration: underline; }
            .test3 { text-decoration: overline; }
            .test4 { text-decoration: line-through; }
			i { text-decoration: line-through; }
            .test5 { text-decoration: underline red; }
            .test6 { text-decoration: line-through #00ff00; }
            .test7 { text-decoration: underline overline blue; }
            .test8 { text-decoration: underline; text-decoration-color: red; }
            .test9 { color: blue; text-decoration: underline; text-decoration-color: red; }
		</style>
</head>
<body>
    <p class="test1">none</p>
    <p class="test2">underline</p>
    <p class="test3">overline</p>
    <p class="test4">line-through</p>
    <p>asdf<u>asdf</u> asdf <i>asdf</i></p>
    <p class="test5">underline red</p>
    <p class="test6">line-through green (hex)</p>
    <p class="test7">underline overline blue</p>
    <p class="test8">underline, text-decoration-color red</p>
    <p class="test9">blue text, text-decoration-color red</p>
</body>

</html>
