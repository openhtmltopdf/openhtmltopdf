<html>
<head>
<meta charset="UTF-8"/>
<style>
/* UNCOMMENT BELOW TO VIEW IN BROWSER FOR COMPARISON */
/*

@page {
  size: 420px 700px;
  margin: 10px;
}
body {
  margin: 0;
  font-family: 'TestFont', 'arabic';
  font-size: 14px;
}
.w { width: 120px; background: #cde; }
table { background: #fdc; margin: 4px 0; }
p { margin: 2px 0; }
ul, ol, dl { margin: 4px 0; }
.frame { border: 1px solid #888; margin: 6px 0; }
</style>
</head>
<body>
<!-- In right-to-left text, a block narrower than its container starts at the right
     (CSS 2.1 10.3.3), and lists are indented on the right, where their markers go. -->
<div dir="rtl" class="frame">
  <div class="w">div 120px</div>
  <div class="w" style="box-sizing: border-box; padding: 0 10px; border-right: 4px solid #48c">border-box</div>
  <div style="max-width: 160px; background: #dfd">max-width 160px</div>
  <div style="width: 100px; margin-right: 30px; background: #fd8">margin-right 30px</div>
  <div style="width: 150px; margin-left: auto; margin-right: auto; background: #eee">auto margins</div>
  <table><tr><td>table auto</td></tr></table>
  <table style="width: 200px"><tr><td>table 200px</td></tr></table>
  <img src="../../demos/images/flyingsaucer.png" style="display: block; width: 40px"/>

  <ul><li>disc one</li><li>مرحبا</li></ul>
  <ol><li>first</li><li>second</li></ol>
  <ul style="list-style-type: square"><li>square</li></ul>
  <dl><dt>term</dt><dd>description</dd></dl>

  <div dir="ltr">
    <ul><li>ltr list inside rtl</li></ul>
    <div class="w">ltr div 120px</div>
  </div>
</div>

<!-- Wider than its container: stays at the left, not cut off the page. -->
<div dir="rtl" class="frame" style="width: 200px">
  <div style="width: 260px; background: #fcc">wider than its container</div>
</div>
</body>
</html>
