<html>
<head>
    <style>
        @page {
            size: 400px 120px;
            margin: 10px;
            @footnote {
                float: bottom;
                border-top: 1px solid black;
            }
        }

        body {
            margin: 0;
            font-family: 'TestFont';
            font-size: 14px;
        }

        .columns {
            column-count: 2;
        }

        span.footnote {
            float: footnote;
            font-size: 10px;
        }

        ::footnote-call {
            counter-increment: footnote;
            content: counter(footnote);
            vertical-align: super;
        }

        ::footnote-marker {
            content: counter(footnote);
            vertical-align: super;
        }
    </style>
</head>
<body>
<div>
    Text before column typesetting with a footnote call<span class="footnote">footnote text</span>.
    <hr/>
</div>
<div class="columns">
    Text in two columns which ran into the footnote area before the fix.
    Text in two columns which ran into the footnote area before the fix.
</div>
</body>
</html>
