<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
    <style type="text/css">
        /*
         * Issue #162, case B without -fs-table-paginate: the inherited
         * -fs-page-break-min-height reserve applies to the tbody section of a plain
         * table too. Here the header is not repeated on later pages, so a page break
         * taken on the body section alone strands the only copy of the header at the
         * foot of page 1 while every row sits on page 2. The escalation must move the
         * whole table regardless of pagination mode.
         */
        @page {
            size: A4;
            margin: 35mm 20mm;
        }
        body {
            margin: 0;
            font-family: TestFont, sans-serif;
            font-size: 10pt;
        }
        table {
            border-collapse: collapse;
            width: 100%;
            margin: 8pt 0 10pt;
            -fs-page-break-min-height: 1.5cm;
        }
        th, td {
            border: 0.5pt solid #999;
            padding: 4pt;
            text-align: left;
            vertical-align: top;
        }
        thead {
            display: table-header-group;
        }
        thead th {
            color: #fff;
            background-color: #6d7778;
        }
        thead, tr {
            page-break-inside: avoid;
        }
        tbody tr:first-child td {
            height: 40pt;
        }
        .spacer {
            height: 589pt;
        }
    </style>
</head>
<body>
    <div class="spacer">spacer</div>
    <table>
        <thead>
            <tr><th>Head A</th><th>Head B</th></tr>
        </thead>
        <tbody>
            <tr><td>row 1 a</td><td>row 1 b</td></tr>
            <tr><td>row 2 a</td><td>row 2 b</td></tr>
            <tr><td>row 3 a</td><td>row 3 b</td></tr>
            <tr><td>row 4 a</td><td>row 4 b</td></tr>
            <tr><td>row 5 a</td><td>row 5 b</td></tr>
            <tr><td>row 6 a</td><td>row 6 b</td></tr>
            <tr><td>row 7 a</td><td>row 7 b</td></tr>
            <tr><td>row 8 a</td><td>row 8 b</td></tr>
            <tr><td>row 9 a</td><td>row 9 b</td></tr>
            <tr><td>row 10 a</td><td>row 10 b</td></tr>
            <tr><td>row 11 a</td><td>row 11 b</td></tr>
            <tr><td>row 12 a</td><td>row 12 b</td></tr>
        </tbody>
    </table>
</body>
</html>
