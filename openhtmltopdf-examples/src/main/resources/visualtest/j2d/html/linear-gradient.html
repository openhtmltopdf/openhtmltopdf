<html>
<head>
<style>
@page {
  margin: 0;
  size: 200px 200px;
}
body {
  margin: 0;
  padding: 0px;
  max-width: 200px;
}
</style>
</head>
<body>
<div style="height: 20px; background-image: linear-gradient(to left, red, orange 30%, blue);"></div>

<div style="transform: rotate(90deg); height: 30px; background-image: linear-gradient(to top, red, green);"></div>

<!-- Two stops at the same position give a hard edge: a 10px red bar at the
     bottom, whatever the size of the box. -->
<div style="height: 40px; width: 60px; background-image: linear-gradient(to top, red 0, red 10px, white 10px, white);"></div>

</body>
</html>
