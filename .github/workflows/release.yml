name: release

on:
  workflow_dispatch:
    inputs:
      increment:
        description: "Version part to increment"
        type: choice
        options: [patch, minor, major]
        default: patch
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      # Workflow-only changes need no release; run it by hand if one does.
      - ".github/**"

# Serialize release runs: "Get next version" derives the version from git tags,
# but the tag is only pushed after the slow Maven Central upload. Two overlapping
# runs therefore compute the same version and the second deploy is rejected as a
# duplicate (see run #76 vs #75, 2026-07-20).
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: ['8', '11', '17','21', '25']
    if: github.repository_owner == 'openhtmltopdf'
    steps:
      - uses: actions/checkout@v5
      - name: Set up JDK ${{matrix.java}}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{matrix.java}}
          cache: maven
      - name: Maven -v
        run: ./mvnw -v
      - name: Build with Maven
        run: ./mvnw -B package --file pom.xml -Drevision=${{ github.sha }}

  release:
    name: Create release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Step 1 - Checkout code
        uses: actions/checkout@v5
      - name: Step 2 - Import GPG key
        run: |
          echo "${{ secrets.GPG_PUBLIC_KEY }}" | gpg --import
          echo "${{ secrets.GPG_SECRET_KEY }}" | gpg --import --no-tty --batch --yes
      - name: Step 3 - Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 8
          cache: maven
      # A patch release by default; "[minor]" or "[major]" in the message of the
      # pushed commit (the squash title of a pull request) asks for a bigger step.
      - name: Step 4a - Choose the version part to increment
        id: increment
        env:
          MESSAGE: ${{ github.event.head_commit.message }}
          INPUT: ${{ inputs.increment }}
        run: |
          if [ -n "$INPUT" ]; then
            part="$INPUT"
          elif printf '%s' "$MESSAGE" | grep -qF '[major]'; then
            part=major
          elif printf '%s' "$MESSAGE" | grep -qF '[minor]'; then
            part=minor
          else
            part=patch
          fi
          echo "Incrementing the $part version"
          echo "part=$part" >> "$GITHUB_OUTPUT"
      - name: Step 4 - Get next version
        uses: reecetech/version-increment@2023.9.3
        id: version
        with:
          scheme: semver
          increment: ${{ steps.increment.outputs.part }}
      - name: Step 5 - Prepare and perform release
        run: ./mvnw -B deploy --no-transfer-progress -e -Prelease -Drevision=${{ steps.version.outputs.version }} -s settings.xml
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_CENTRAL_TOKEN: ${{ secrets.MAVEN_CENTRAL_TOKEN }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
          GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
      - name: Step 6 - Upload artifact to GitHub Package Registry
        run: ./mvnw -B deploy -Dgithub-release -Drevision=${{ steps.version.outputs.version }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Step 7 - Push Git tag for the new release
        uses: rickstaa/action-create-tag@v1
        id: "tag_create"
        with:
          tag: ${{ steps.version.outputs.version }}
          tag_exists_error: false
      - name: Step 8 - Create GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run:
          gh release create '${{ steps.version.outputs.version }}' -t openhtmltopdf --generate-notes